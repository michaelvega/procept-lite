<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIG Network</title>
<style>
:root{--bg:#050805;--panel:#0a100a;--line:#1d2a1d;--fg:#cfe9cf;--dim:#7c967c;--green:#2dff7a;--red:#ff4d4d;--grey:#8c928c;--node:#223022;--ink:#050805;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f6f1;--panel:#ffffff;--line:#b7c6b7;--fg:#0f190f;--dim:#4d604d;--green:#0b8f3d;--red:#c42020;--grey:#767c76;--node:#d3ddd3;--ink:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:0 16px 40px}
.wrap{max-width:1440px;margin:0 auto}
button,.tab{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:5px 9px;cursor:pointer;text-decoration:none}
button:hover,.tab:hover{border-color:var(--green)}
button:focus-visible,.tab:focus-visible,.cta:focus-visible,tbody tr:focus-visible,th:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button.on{background:var(--green);color:var(--ink);border-color:var(--green)}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
h1 span{color:var(--green)}
h2{font-size:12px;margin:0 0 8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:normal}
.toggle{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toggle .lab{color:var(--dim);margin-right:2px}
.tab{display:inline-flex;align-items:center;gap:8px}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lk i,.lockline i{position:relative;flex:none;display:inline-block;width:8px;height:6px;margin-top:4px;background:currentColor}
.lk i::before,.lockline i::before{content:"";position:absolute;left:1px;bottom:100%;width:6px;height:4px;border:1.5px solid currentColor;border-bottom:0;border-radius:3px 3px 0 0}
.tab:hover .lk,.tab:focus-visible .lk{color:var(--green)}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;color:var(--dim);border-bottom:1px solid var(--line)}
.strip b{color:var(--fg);font-weight:normal}
.strip .g{color:var(--green)}.strip .r{color:var(--red)}.strip .y{color:var(--grey)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:14px;align-items:start}
.box{border:1px solid var(--line);background:var(--panel);padding:10px;min-width:0}
#gwrap{overflow-x:auto;border:1px solid var(--line);background:var(--bg)}
#gsvg{display:block;margin:0 auto;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:8px;color:var(--dim)}
.legend i{display:inline-block;width:18px;height:10px;border:1px solid var(--line);margin:0 -6px 0 0}
.legend i:last-of-type{margin-right:0}
.legend .sz{margin-left:14px}
.note{color:var(--dim);margin:6px 0 0}
svg text{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--fg);pointer-events:none}
svg .sub{fill:var(--dim);font-size:9px}
svg .blsvg{filter:url(#cigblur)}
.ed{fill:none;cursor:pointer}
.eh{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
svg.has-sel .ed{opacity:.1}
svg.has-sel .ed.hot{opacity:1}
.ed.pick{stroke-dasharray:5 3}
.nd{cursor:pointer}
.nd:focus{outline:0}
.nd .hit{fill:transparent}
.nd:hover .shape,.nd:focus-visible .shape{stroke:var(--green);stroke-width:2.5}
.nd.sel .shape{stroke:var(--green);stroke-width:3}
.bl{display:inline-block;padding:0 .3em;filter:blur(.28em);-webkit-user-select:none;user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
#panel .x{display:none;float:right}
#panel .kick{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#panel .title{font-size:15px;overflow-wrap:anywhere;margin:2px 0 10px}
#panel .arrow{color:var(--dim);margin:0 .4em}
#panel p{margin:8px 0}
#panel .cap{color:var(--dim);font-size:12px;margin:2px 0 0}
#panel .lockline{display:flex;align-items:flex-start;gap:8px;color:var(--dim);margin-top:14px}
#panel .lockline i{margin-top:9px}
.ob{display:flex;height:8px;border:1px solid var(--line);margin:8px 0 0}
.ob i{display:block;height:100%}
.ob .g{background:var(--green)}.ob .y{background:var(--grey)}.ob .r{background:var(--red)}
.cta{display:block;margin-top:16px;padding:11px 12px;background:var(--green);color:var(--ink);border:1px solid var(--green);text-decoration:none;font-weight:bold;line-height:1.4}
.cta::after{content:" \2192"}
.cta:hover{background:var(--panel);color:var(--green)}
section.tools{margin-top:16px}
.tw{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{color:var(--dim);font-weight:normal;user-select:none}
th[tabindex]{cursor:pointer}
th.srt{color:var(--green)}
td.n,th.n{text-align:right}
th.c1,th.c2{width:72px}
th.c3{width:150px}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--node)}
.mb{display:inline-block;width:54px;height:8px;border:1px solid var(--line);vertical-align:middle;margin-right:8px}
.mb i{display:block;height:100%;background:var(--green)}
@media (max-width:899px){
  main{grid-template-columns:minmax(0,1fr)}
  #panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:72vh;z-index:10;border:0;border-top:1px solid var(--green);padding:12px 16px 22px;visibility:hidden;transform:translateY(105%)}
  #panel.open{visibility:visible;transform:none}
  #panel .x{display:inline-block}
}
@media (max-width:520px){
  .toggle .lab{flex:1 0 100%}
  th,td{padding:6px 5px}
  th.c1,th.c2{width:62px}
  th.c3{width:76px}
  .mb{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>CIG <span>//</span> agent failure network</h1>
  <div class="toggle" role="group" aria-label="Dimension">
    <span class="lab">DIMENSION</span>
    <button type="button" class="tab" data-dim="errors" aria-pressed="false">Errors</button>
    <button type="button" class="tab" data-dim="cost" aria-pressed="false">Cost</button>
    <button type="button" class="tab" data-dim="latency" aria-pressed="false">Latency</button>
    <button type="button" class="tab on" data-dim="score" aria-pressed="true">Score</button>
    <button type="button" id="themeBtn" aria-label="Toggle theme">Theme</button>
  </div>
</header>
<div class="strip" id="strip"></div>
<main>
  <div class="box">
    <h2 id="gtitle">Tool flow // SCORE</h2>
    <div id="gwrap"><svg id="gsvg" role="group" aria-label="Tool flow network"></svg></div>
    <div class="legend" id="legend"></div>
    <p class="note" id="gnote"></p>
  </div>
  <aside class="box" id="panel" aria-label="Details" aria-live="polite">
    <button type="button" class="x" id="pclose">close</button>
    <div id="pbody"></div>
    <a class="cta" id="cta" href="__SYSTEM5_URL__" target="_blank" rel="noopener noreferrer">Want to fix these problems? See errors, cost and latency for every node in System 5</a>
  </aside>
</main>
<section class="tools box">
  <h2>Tools <span id="tcount"></span></h2>
  <div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</div>
<script>
(function(){
'use strict';
var D = /*__DATA__*/null;
if(!D){document.body.textContent='This page needs its data.';return;}
var NODES=D.nodes, EDGES=D.edges, S5=D.url, C=D.counts||{};
var NS='http://www.w3.org/2000/svg';
function $(id){return document.getElementById(id);}
function el(tag,attrs,kids,ns){
  var e=ns?document.createElementNS(ns,tag):document.createElement(tag);
  if(attrs)for(var k in attrs){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}
  if(kids)kids.forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function nn(v){return v!==null&&v!==undefined&&v!==''&&isFinite(v);}
function pct(v){return Math.round(v*100)+'%';}
function sgn(v){return (v>0?'+':'')+v.toFixed(2);}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function plural(n,one,many){return n+' '+(n===1?one:many);}

/* ---------- System 5 link: the Errors, Cost and Latency tabs and the call to action open it in a new tab ---------- */
function go5(ev){ev.preventDefault();window.open(S5,'_blank','noopener,noreferrer');}
function wire5(a){
  a.addEventListener('click',go5);
  a.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar')go5(ev);});
}
wire5($('cta'));

/* ---------- colours: green healthy, grey where it fails ---------- */
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));var x=rgb(a),y=rgb(b);return 'rgb('+x.map(function(c,i){return Math.round(c+(y[i]-c)*t);}).join(',')+')';}
var PAL={};
function readPal(){['node','grey','red','green','dim','line','fg'].forEach(function(k){PAL[k]=css('--'+k);});}
var DIM='score',HEAT={errors:['fewer failures','more failures'],cost:['cheaper runs','costlier runs'],latency:['faster','slower']};
var KEY={errors:'err',cost:'cost',latency:'lat'}, TOP={};
function heat(v,k){var t=TOP[k]>0&&nn(v)?v/TOP[k]:null;return t===null?null:mix(PAL.grey,PAL.red,t);}
function sc(v){if(!nn(v))return PAL.node;return v<0?mix(PAL.grey,PAL.red,-v):mix(PAL.grey,PAL.green,v);}

/* ---------- layout: tools are layered by where they usually appear in a run ---------- */
var IDX={}, L=null, sel=null, nodeEls=[], edgeEls=[], rowEls={}, R=[], vertical=false;
NODES.forEach(function(n,i){IDX[n.id]=i;});
var NTOOLS=NODES.filter(function(n){return n.kind==='tool';}).length;
var maxCount=Math.max.apply(null,EDGES.map(function(e){return e.count;}).concat([1]));
function isEnd(n){return n.kind==='answer'||n.kind==='no_answer';}
function layout(cw,vert){
  var nodes=NODES, out=[], inn=[], inw=[];
  nodes.forEach(function(){out.push([]);inn.push([]);inw.push([]);});
  EDGES.forEach(function(e){var a=IDX[e.source],b=IDX[e.target];if(a===undefined||b===undefined||a===b)return;out[a].push(b);inn[b].push(a);inw[b].push([a,e.count]);});
  /* expected step at which a tool is reached: weighted mean over its incoming transitions */
  var depth=nodes.map(function(n){return n.kind==='start'?0:1;});
  for(var it=0;it<40;it++){
    var nd=depth.slice();
    nodes.forEach(function(n,v){
      if(n.kind==='start'||isEnd(n))return;
      var s=0,w=0;inw[v].forEach(function(p){s+=p[1]*(depth[p[0]]+1);w+=p[1];});
      if(w>0)nd[v]=Math.min(12,s/w);
    });
    depth=nd;
  }
  var tools=[],starts=[],ends=[];
  nodes.forEach(function(n,i){if(n.kind==='tool')tools.push(i);else if(n.kind==='start')starts.push(i);else ends.push(i);});
  tools.sort(function(x,y){return depth[x]-depth[y]||nodes[y].calls-nodes[x].calls||x-y;});
  var T=vert?Math.ceil(tools.length/Math.max(2,Math.floor(cw/108))):Math.max(1,Math.floor((cw-150)/140)-1);
  T=Math.max(tools.length?1:0,Math.min(T,tools.length));
  var lay=[starts], base=T?Math.floor(tools.length/T):0, extra=T?tools.length%T:0, p=0;
  for(var l=0;l<T;l++){var m=base+(l<extra?1:0);lay.push(tools.slice(p,p+m));p+=m;}
  lay.push(ends);
  var nl=lay.length, layer=nodes.map(function(){return 0;});
  lay.forEach(function(a,l){a.forEach(function(i){layer[i]=l;});});
  var pos={}; lay.forEach(function(a){a.forEach(function(i,k){pos[i]=(k+0.5)/a.length;});});
  for(var sw=0;sw<6;sw++){
    var order=[];for(var k=0;k<nl;k++)order.push(sw%2?nl-1-k:k);
    order.forEach(function(l){
      var a=lay[l],keys={};
      a.forEach(function(i){var nb=inn[i].concat(out[i]).filter(function(j){return layer[j]!==l;});
        keys[i]=nb.length?nb.reduce(function(s,j){return s+pos[j];},0)/nb.length:pos[i];});
      a.sort(function(x,y){return keys[x]-keys[y]||x-y;});
      a.forEach(function(i,k){pos[i]=(k+0.5)/a.length;});
    });
  }
  var maxC=Math.max.apply(null,lay.map(function(a){return a.length;}).concat([1]));
  var dl=vert?100:140, ds=vert?Math.floor((cw-20)/maxC):64, xy={};
  lay.forEach(function(a,l){a.forEach(function(i,k){
    var off=(k+(maxC-a.length)/2)*ds+ds/2;
    xy[i]=vert?{x:off+10,y:l*dl+40}:{x:l*dl+70,y:off+26};
  });});
  var W=vert?cw:(nl-1)*dl+140, H=vert?(nl-1)*dl+90:maxC*ds+52;
  return {xy:xy,W:Math.max(W,200),H:Math.max(H,140),layer:layer};
}

/* ---------- graph ---------- */
function defs(svg){
  var d=el('defs',null,null,NS);
  var m=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',markerUnits:'userSpaceOnUse',orient:'auto'},null,NS);
  m.appendChild(el('path',{d:'M0,1 L10,5 L0,9 z',style:'fill:var(--dim)'},null,NS));
  d.appendChild(m);
  var f=el('filter',{id:'cigblur',x:'-30%',y:'-150%',width:'160%',height:'400%'},null,NS);
  f.appendChild(el('feGaussianBlur',{stdDeviation:'3.2'},null,NS));
  d.appendChild(f);
  svg.appendChild(d);
}
function bow(la,lb,k){var span=Math.abs(lb-la);return span<2?0:(k%2?1:-1)*Math.min(54,18*span);}
function edgePath(e,r1,r2,k){
  var a=L.xy[IDX[e.source]],b=L.xy[IDX[e.target]];
  if(!a||!b)return '';
  if(e.source===e.target){var rr=r1;return vertical?'M'+(a.x+rr)+','+(a.y-4)+' C'+(a.x+rr+34)+','+(a.y-28)+' '+(a.x+rr+34)+','+(a.y+28)+' '+(a.x+rr)+','+(a.y+4):
    'M'+(a.x-4)+','+(a.y-rr)+' C'+(a.x-28)+','+(a.y-rr-34)+' '+(a.x+28)+','+(a.y-rr-34)+' '+(a.x+4)+','+(a.y-rr);}
  var la=L.layer[IDX[e.source]],lb=L.layer[IDX[e.target]];
  if(!vertical){
    if(la===lb){var dir=b.y>a.y?1:-1,bx=a.x+46;return 'M'+(a.x+r1*0.7)+','+(a.y+dir*r1*0.7)+' Q'+bx+','+((a.y+b.y)/2)+' '+(b.x+r2*0.7)+','+(b.y-dir*r2*0.7);}
    var s=lb>la?1:-1,x1=a.x+s*r1,x2=b.x-s*r2,mx=(x1+x2)/2,bw=bow(la,lb,k);
    return 'M'+x1+','+a.y+' C'+mx+','+(a.y+bw)+' '+mx+','+(b.y+bw)+' '+x2+','+b.y;
  }
  if(la===lb){var d2=b.x>a.x?1:-1,by=a.y+40;return 'M'+(a.x+d2*r1*0.7)+','+(a.y+r1*0.7)+' Q'+((a.x+b.x)/2)+','+by+' '+(b.x-d2*r2*0.7)+','+(b.y+r2*0.7);}
  var s2=lb>la?1:-1,y1=a.y+s2*r1,y2=b.y-s2*r2,my=(y1+y2)/2,bw2=bow(la,lb,k);
  return 'M'+a.x+','+y1+' C'+(a.x+bw2)+','+my+' '+(b.x+bw2)+','+my+' '+b.x+','+y2;
}
function nodeAria(n){
  if(n.kind!=='tool')return n.label+', '+plural(n.runs,'run','runs');
  return (n.hidden?'Tool, name hidden in System 5':n.label+', tool')+', '+plural(n.calls,'call','calls');
}
function draw(){
  var svg=$('gsvg'),wrap=$('gwrap');clear(svg);nodeEls=[];edgeEls=[];
  var cw=wrap.clientWidth||960;
  vertical=cw<720;
  L=layout(cw,vertical);
  svg.setAttribute('viewBox','0 0 '+L.W+' '+L.H);
  svg.style.maxWidth=L.W+'px';
  defs(svg);
  var hg=el('g',null,null,NS),eg=el('g',null,null,NS),ng=el('g',null,null,NS);
  svg.appendChild(hg);svg.appendChild(eg);svg.appendChild(ng);
  R=NODES.map(function(n){return n.kind!=='tool'?9:(nn(n.score)?7+13*Math.abs(n.score):8);});
  EDGES.forEach(function(e,i){
    var a=IDX[e.source],b=IDX[e.target];
    var vis=el('path',{'class':'ed','marker-end':'url(#arr)'},null,NS),hit=el('path',{'class':'eh'},null,NS);
    var d=edgePath(e,R[a],R[b],i);vis.setAttribute('d',d);hit.setAttribute('d',d);
    function pick(ev){ev.stopPropagation();select({t:'e',i:i});}
    vis.addEventListener('click',pick);hit.addEventListener('click',pick);
    hg.appendChild(hit);eg.appendChild(vis);edgeEls.push({vis:vis,a:a,b:b});
  });
  NODES.forEach(function(n,i){
    var xy=L.xy[i],r=R[i];
    var g=el('g',{'class':'nd',transform:'translate('+xy.x+','+xy.y+')',tabindex:'0',role:'button','aria-label':nodeAria(n)},null,NS);
    g.appendChild(el('circle',{'class':'hit',r:Math.max(r+6,18)},null,NS));
    var shape=n.kind==='tool'?el('circle',{'class':'shape',r:r},null,NS):el('rect',{'class':'shape',x:-9,y:-9,width:18,height:18},null,NS);
    g.appendChild(shape);
    var lab=el('text',{y:n.kind==='tool'?r+12:23,'text-anchor':'middle'},null,NS);
    if(n.hidden)lab.setAttribute('class','blsvg');
    lab.textContent=trunc(n.label,vertical?15:20);
    g.appendChild(lab);
    var sub=el('text',{'class':'sub',y:n.kind==='tool'?r+22:33,'text-anchor':'middle'},null,NS);
    sub.textContent=n.kind==='tool'?(n.calls+'x'):(n.runs+' runs');
    g.appendChild(sub);
    g.appendChild(el('title',{text:n.hidden?'Tool name hidden: shown in System 5':n.label},null,NS));
    g.addEventListener('click',function(ev){ev.stopPropagation();select({t:'n',i:i});});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select({t:'n',i:i});}});
    ng.appendChild(g);nodeEls.push({g:g,shape:shape});
  });
  recolor();
}
function recolor(){
  readPal();
  NODES.forEach(function(n,i){
    var s=nodeEls[i].shape;
    var hc=DIM==='score'||n.kind!=='tool'?null:heat(n[KEY[DIM]],'n'+DIM);
    s.setAttribute('fill',hc||(DIM==='score'&&D.has_scores?sc(n.score):PAL.node));
    s.setAttribute('stroke',n.kind==='tool'?PAL.fg:PAL.dim);
    s.setAttribute('stroke-width',n.kind==='tool'?1:1.5);
    if(n.kind!=='tool')s.setAttribute('stroke-dasharray','3 2');
  });
  EDGES.forEach(function(e,i){
    var p=edgeEls[i].vis,v=D.has_scores?e.score:null,t=nn(v)?Math.abs(v):0,ct=Math.sqrt(e.count/maxCount);
    var col=nn(v)?sc(v):PAL.line;
    if(DIM!=='score'){var hv=e[KEY[DIM]];t=TOP['e'+DIM]>0&&nn(hv)?hv/TOP['e'+DIM]:0;col=nn(hv)?heat(hv,'e'+DIM):PAL.line;}
    p.setAttribute('stroke',col);
    p.setAttribute('stroke-width',(0.6+1.7*t+1.5*ct).toFixed(2));
    p.setAttribute('stroke-opacity',(0.3+0.55*ct).toFixed(2));
  });
  legend();
}
function legend(){
  var lg=$('legend');clear(lg);
  if(DIM!=='score'){
    lg.appendChild(el('span',{text:HEAT[DIM][0]}));
    [0,0.25,0.5,0.75,1].forEach(function(v){var i=el('i');i.style.background=mix(PAL.grey,PAL.red,v);lg.appendChild(i);});
    lg.appendChild(el('span',{text:HEAT[DIM][1]}));
  }else if(D.has_scores){
    lg.appendChild(el('span',{text:'falls short'}));
    [-1,-0.5,0,0.5,1].forEach(function(v){var i=el('i');i.style.background=sc(v);lg.appendChild(i);});
    lg.appendChild(el('span',{text:'reaches the goal'}));
    lg.appendChild(el('span',{'class':'sz',text:'bigger circle = clearer signal'}));
  }else lg.appendChild(el('span',{text:'Runs are not graded yet: the score colours appear once they are.'}));
  var note=[];
  if(D.grouped)note.push('The '+D.grouped+' least-used tools are grouped as "other".');
  note.push('Click a tool, a link or the background for details.');
  $('gnote').textContent=note.join(' ');
}
['errors','cost','latency'].forEach(function(d){
  TOP['n'+d]=Math.max.apply(null,NODES.filter(function(n){return n.kind==='tool'&&nn(n[KEY[d]]);}).map(function(n){return n[KEY[d]];}).concat([0]));
  TOP['e'+d]=Math.max.apply(null,EDGES.filter(function(e){return nn(e[KEY[d]]);}).map(function(e){return e[KEY[d]];}).concat([0]));
});
document.querySelectorAll('button[data-dim]').forEach(function(b){
  b.addEventListener('click',function(){
    DIM=b.getAttribute('data-dim');
    document.querySelectorAll('button[data-dim]').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});
    $('gtitle').textContent='Tool flow // '+DIM.toUpperCase();
    recolor();
  });
});
function paintSel(){
  var n=sel&&sel.t==='n'?sel.i:-1, e=sel&&sel.t==='e'?sel.i:-1;
  nodeEls.forEach(function(ne,i){ne.g.classList.toggle('sel',i===n);});
  edgeEls.forEach(function(x,i){x.vis.classList.toggle('hot',i===e||(n>=0&&(x.a===n||x.b===n)));x.vis.classList.toggle('pick',i===e);});
  $('gsvg').classList.toggle('has-sel',n>=0||e>=0);
  for(var k in rowEls)rowEls[k].classList.toggle('sel',+k===n);
}

/* ---------- right-hand panel: a short teaser of what was clicked, then the way to System 5 ---------- */
function nameOf(n){
  if(!n.hidden)return [el('span',{text:n.label})];
  return [el('span',{'class':'bl','aria-hidden':'true',text:n.label}),el('span',{'class':'sr',text:'name hidden'})];
}
function para(text,cls){return el('p',cls?{'class':cls,text:text}:{text:text});}
function lockline(text){var p=el('p',{'class':'lockline'});p.appendChild(el('i'));p.appendChild(el('span',{text:text}));return p;}
function outcomeBar(g,b){
  g=nn(g)?g:0;b=nn(b)?b:0;var y=Math.max(0,1-g-b);
  var bar=el('div',{'class':'ob',role:'img','aria-label':pct(g)+' good, '+pct(y)+' ambiguous, '+pct(b)+' bad'});
  [['g',g],['y',y],['r',b]].forEach(function(s){bar.appendChild(el('i',{'class':s[0],style:'width:'+(s[1]*100).toFixed(1)+'%'}));});
  return [bar,el('p',{'class':'cap',text:pct(g)+' good, '+pct(y)+' ambiguous, '+pct(b)+' bad'})];
}
function tally(){
  var n=C.good+C.ambiguous+C.bad;return n?C.good/n:null;
}
function renderPanel(){
  var body=$('pbody');clear(body);
  function add(x){(Array.isArray(x)?x:[x]).forEach(function(c){body.appendChild(c);});}
  var kick=el('div',{'class':'kick'}),title=el('div',{'class':'title'});
  if(sel&&sel.t==='n'){
    var n=NODES[sel.i];
    kick.textContent=n.kind==='tool'?'Tool':n.kind==='start'?'Start':n.kind==='answer'?'Answer':'No answer';
    nameOf(n).forEach(function(c){title.appendChild(c);});
    add([kick,title]);
    if(n.kind==='tool')add(para(plural(n.calls,'call','calls')+' across '+plural(n.runs,'run','runs')+'.'));
    else if(n.kind==='start')add(para('Every run begins here: '+plural(n.runs,'run','runs')+'.'));
    else add(para(plural(n.runs,'run','runs')+(n.kind==='answer'?' ended with an answer.':' ended without an answer.')));
    if(D.has_scores&&nn(n.good))add(outcomeBar(n.good,n.bad));
    add(lockline(n.hidden?'The name, errors, cost and latency of this tool are in System 5.':n.kind==='tool'?'Errors, cost and latency for this tool are in System 5.':'Errors, cost and latency for every node are in System 5.'));
  }else if(sel&&sel.t==='e'){
    var e=EDGES[sel.i],a=NODES[IDX[e.source]],b=NODES[IDX[e.target]];
    kick.textContent='Link';
    nameOf(a).forEach(function(c){title.appendChild(c);});
    title.appendChild(el('span',{'class':'arrow',text:'→'}));
    nameOf(b).forEach(function(c){title.appendChild(c);});
    add([kick,title]);
    add(para((e.source===e.target?'Called again straight after itself ':'Seen ')+plural(e.count,'time','times')+' across '+plural(e.runs,'run','runs')+'.'));
    if(D.has_scores&&nn(e.score))add(para('Runs through this link score '+sgn(e.score)+', on a scale from -1 (bad) to +1 (good).'));
    add(lockline('Errors, cost and latency for this link are in System 5.'));
  }else{
    kick.textContent='Network';
    title.textContent=plural(NTOOLS,'tool','tools')+', '+plural(EDGES.length,'link','links');
    add([kick,title]);
    var g=tally();
    add(para(plural(D.runs,'run','runs')+(D.has_scores&&g!==null?'. Users reach their goal in '+pct(g)+' of them.':'.')));
    if(D.has_scores)add(outcomeBar(C.good/Math.max(1,C.good+C.ambiguous+C.bad),C.bad/Math.max(1,C.good+C.ambiguous+C.bad)));
    add(para('Click a tool or a link to see where runs reach their goal.','cap'));
    add(lockline('Errors, cost and latency for every node are in System 5.'));
  }
}
function select(x){sel=x;paintSel();renderPanel();$('panel').classList.add('open');}
function closePanel(){$('panel').classList.remove('open');sel=null;paintSel();renderPanel();}
$('pclose').addEventListener('click',closePanel);
$('gwrap').addEventListener('click',function(){select(null);});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closePanel();});

/* ---------- tools list ---------- */
var COLS=[['label','tool',0,0],['calls','calls',1,1],['runs','runs',1,1],['good','goal reach',1,1]];
var tstate={key:'runs',dir:-1};
function sortVal(i){var n=NODES[i],v=n[tstate.key];return nn(v)?+v:-1;}
function renderTable(){
  var h=$('thead'),tb=$('tbody');clear(h);clear(tb);rowEls={};
  var cols=COLS.filter(function(c){return c[0]!=='good'||D.has_scores;});
  cols.forEach(function(c,k){
    var on=tstate.key===c[0];
    var th=el('th',{text:c[1]+(on?(tstate.dir>0?' ▲':' ▼'):''),'class':(c[2]?'n ':'')+(on?'srt ':'')+'c'+k});
    if(c[3]){
      th.setAttribute('tabindex','0');th.setAttribute('role','button');
      var go=function(){if(tstate.key===c[0])tstate.dir=-tstate.dir;else{tstate.key=c[0];tstate.dir=-1;}renderTable();paintSel();};
      th.addEventListener('click',go);th.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go();}});
    }
    h.appendChild(th);
  });
  var idxs=[];NODES.forEach(function(n,i){if(n.kind==='tool')idxs.push(i);});
  idxs.sort(function(x,y){return (sortVal(y)-sortVal(x))*-tstate.dir||x-y;});
  idxs.forEach(function(i){
    var n=NODES[i],tr=el('tr',{tabindex:'0'});
    var c0=el('td');nameOf(n).forEach(function(c){c0.appendChild(c);});
    if(!n.hidden)c0.setAttribute('title',n.label);
    tr.appendChild(c0);
    tr.appendChild(el('td',{'class':'n',text:String(n.calls)}));
    tr.appendChild(el('td',{'class':'n',text:String(n.runs)}));
    if(D.has_scores){
      var c3=el('td',{'class':'n'});
      if(nn(n.good)){c3.appendChild(el('span',{'class':'mb'},[el('i',{style:'width:'+Math.round(n.good*100)+'%'})]));c3.appendChild(document.createTextNode(pct(n.good)));}
      else c3.textContent='not graded';
      tr.appendChild(c3);
    }
    tr.addEventListener('click',function(){select({t:'n',i:i});});
    tr.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select({t:'n',i:i});}});
    tb.appendChild(tr);rowEls[i]=tr;
  });
  if(!idxs.length){var tr=el('tr');tr.appendChild(el('td',{colspan:String(cols.length),text:'No tool calls in these runs.'}));tb.appendChild(tr);}
  $('tcount').textContent='('+idxs.length+')';
}

/* ---------- header + wiring ---------- */
function strip(){
  var s=$('strip');clear(s);
  function item(label,val,cls){var sp=el('span');sp.appendChild(document.createTextNode(label+' '));sp.appendChild(el('b',{'class':cls||'',text:String(val)}));s.appendChild(sp);}
  item('runs',D.runs);item('conversations',D.conversations);
  item('good',C.good|0,'g');item('ambiguous',C.ambiguous|0,'y');item('bad',C.bad|0,'r');if(C.ungraded)item('ungraded',C.ungraded);
  item('tools',NTOOLS);
}
$('themeBtn').addEventListener('click',function(){
  var root=document.documentElement,t=root.getAttribute('data-theme')==='light'?'dark':'light';
  root.setAttribute('data-theme',t);
  try{localStorage.setItem('cig-theme',t);}catch(e){}
  recolor();
});
try{var st=localStorage.getItem('cig-theme');if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st);}catch(e){}
var lastBucket=Math.floor(window.innerWidth/100);
window.addEventListener('resize',function(){var b=Math.floor(window.innerWidth/100);if(b!==lastBucket){lastBucket=b;draw();paintSel();}});
strip();renderTable();draw();renderPanel();
})();
</script>
</body>
</html>
